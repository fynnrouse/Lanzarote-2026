<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Setup | Holiday Restaurant League</title>

    <link rel="stylesheet" href="styles.css">

</head>

<body>

<header class="page-header">

    <h1>⚙️ Holiday Restaurant League</h1>
    <p>Administrator Setup</p>

</header>

<main class="container">

    <!-- LOGIN CARD -->

    <section id="loginCard" class="card">

        <h2>Administrator Login</h2>

        <p>
            Enter the admin password to unlock the settings.
        </p>

        <label for="password">
            Password
        </label>

        <input
            type="password"
            id="password"
            autocomplete="off"
        >

        <button id="loginButton">
            Login
        </button>

        <p id="loginMessage" class="message"></p>

    </section>



    <!-- SETTINGS CARD -->

    <section
        id="settingsCard"
        class="card hidden"
    >

        <h2>Holiday Settings</h2>

        <label for="holidayName">
            Holiday Name
        </label>

        <input
            id="holidayName"
            type="text"
        >

        <label for="holidayDay">
            Holiday Day
        </label>

        <input
            id="holidayDay"
            type="number"
            min="1"
        >

        <label for="restaurantName">
            Today's Restaurant
        </label>

        <input
            id="restaurantName"
            type="text"
        >

        <label for="restaurantTime">
            Booking Time
        </label>

        <input
            id="restaurantTime"
            type="time"
        >

        <button id="saveButton">

            Save Changes

        </button>

        <p
            id="saveMessage"
            class="message"
        ></p>

    </section>



    <!-- DANGER ZONE -->

    <section
        id="dangerCard"
        class="card hidden danger-card"
    >

        <h2>Danger Zone</h2>

        <p>

            Delete every submission for today's restaurant.

        </p>

        <button id="deleteButton">

            Delete Today's Scores

        </button>

        <p
            id="deleteMessage"
            class="message"
        ></p>

    </section>



    <!-- NAVIGATION -->

    <section class="card">

        <button
            id="homeButton"
            onclick="window.location.href='index.html';"
        >

            ← Return Home

        </button>

    </section>

</main>



<!-- API -->

<script src="api.js"></script>

<!-- Page Logic -->

<script>

const ADMIN_PASSWORD = "holiday";

const loginCard = document.getElementById("loginCard");
const settingsCard = document.getElementById("settingsCard");
const dangerCard = document.getElementById("dangerCard");

const loginButton = document.getElementById("loginButton");
const saveButton = document.getElementById("saveButton");
const deleteButton = document.getElementById("deleteButton");

loginButton.addEventListener("click", login);

saveButton.addEventListener("click", saveSettings);

deleteButton.addEventListener("click", deleteScores);



async function login(){

    const password =
        document.getElementById("password").value;

    const message =
        document.getElementById("loginMessage");

    if(password !== ADMIN_PASSWORD){

        message.textContent =
            "Incorrect password.";

        return;

    }

    message.textContent = "";

    loginCard.classList.add("hidden");

    settingsCard.classList.remove("hidden");

    dangerCard.classList.remove("hidden");

    await loadSettings();

}



async function loadSettings(){

    try{

        const settings =
            await API.getSettings();

        document.getElementById("holidayName").value =
            settings.holidayName || "";

        document.getElementById("holidayDay").value =
            settings.holidayDay || "";

        document.getElementById("restaurantName").value =
            settings.currentRestaurant || "";

        document.getElementById("restaurantTime").value =
            settings.currentRestaurantTime || "";

    }

    catch(error){

        alert(error.message);

    }

}



async function saveSettings(){

    try{

        await API.updateSettings({

            holidayName:
                document.getElementById("holidayName").value,

            holidayDay:
                document.getElementById("holidayDay").value,

            currentRestaurant:
                document.getElementById("restaurantName").value,

            currentRestaurantTime:
                document.getElementById("restaurantTime").value

        });

        document.getElementById("saveMessage").textContent =
            "✓ Saved Successfully";

    }

    catch(error){

        document.getElementById("saveMessage").textContent =
            error.message;

    }

}



async function deleteScores(){

    if(!confirm(
        "Delete ALL submissions for today's restaurant?"
    )){

        return;

    }

    try{

        const result =
            await API.deleteTodaysScores();

        document.getElementById("deleteMessage").textContent =
            result.message;

    }

    catch(error){

        document.getElementById("deleteMessage").textContent =
            error.message;

    }

}

</script>

</body>

</html>
