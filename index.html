<!DOCTYPE html>
<html lang="en">

<head>

<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Holiday Restaurant League</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<header class="page-header">

<h1>🍽 Holiday Restaurant League</h1>

<p id="holidayName">

Loading Holiday...

</p>

</header>



<main class="container">

<!-- TODAY -->

<div class="card">

<h2>

Today's Restaurant

</h2>

<h3 id="restaurantName">

Loading...

</h3>

<p id="restaurantTime">

Loading...

</p>

<p id="holidayDay">

Day ...

</p>

</div>



<!-- SUBMISSION PROGRESS -->

<div class="card">

<h2>

Today's Progress

</h2>

<h1 id="progressDisplay">

0 / 6 Submitted

</h1>

</div>



<!-- NAVIGATION -->

<div class="card">

<h2>

Menu

</h2>

<div class="menuGrid">

<button
onclick="window.location.href='submit.html'">

Submit Scores

</button>

<button
onclick="window.location.href='review.html'">

Today's Review

</button>

<button
onclick="window.location.href='graphs.html'">

Graphs

</button>

<button
onclick="window.location.href='history.html'">

History

</button>

<button
onclick="window.location.href='setup.html'">

Admin Setup

</button>

</div>

</div>



<!-- LEADERBOARD -->

<div class="card">

<h2>

🏆 Holiday Leaderboard

</h2>

<p>

(Coming in Milestone 2)

</p>

<ol>

<li>🥇 ---</li>

<li>🥈 ---</li>

<li>🥉 ---</li>

</ol>

</div>



</main>

<script src="api.js"></script>

<script>

window.onload = async function(){

    await loadHomepage();

};



async function loadHomepage(){

    try{

        const settings =
            await API.getSettings();

        document
        .getElementById("holidayName")
        .innerHTML =
        settings.holidayName;

        document
        .getElementById("holidayDay")
        .innerHTML =
        "Day " +
        settings.holidayDay;

        document
        .getElementById("restaurantName")
        .innerHTML =
        settings.currentRestaurant;

        document
        .getElementById("restaurantTime")
        .innerHTML =
        settings.currentRestaurantTime;



        const scores =
            await API.getTodaysScores();

        document
        .getElementById("progressDisplay")
        .innerHTML =

        scores.length +

        " / 6 Submitted";

    }

    catch(error){

        alert(error.message);

    }

}

</script>

</body>

</html>
