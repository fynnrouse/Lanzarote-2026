<html lang="en">

<head>

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>Submit Scores</title>

<link rel="stylesheet" href="styles.css">

</head>

<body>

<h1>🍽 Holiday Restaurant League</h1>

<p>Restaurant Scoring</p>

</header>



<main class="container">

<div class="card">

<h2 id="restaurantName">

Loading Restaurant...

</h2>

<p id="restaurantTime">

Loading Time...

</p>

</div>



<!-- PERSON -->

<div class="card">

<h2>

Who are you?

</h2>

<div class="person-grid">

<button class="personButton"
data-person="Darren">

Darren

</button>

<button class="personButton"
data-person="Sarah">

Sarah

</button>

<button class="personButton"
data-person="Sophie">

Sophie

</button>

<button class="personButton"
data-person="George">

George

</button>

<button class="personButton"
data-person="Seb">

Seb

</button>

<button class="personButton"
data-person="Fynn">

Fynn

</button>

</div>

</div>



<!-- FOOD -->
<div class="card">

<h2>Your Progress</h2>

<p id="progressText">

0 of 4 completed

</p>

</div>
    
<div class="card">

<h2>🍔 Food</h2>

<div
id="foodButtons"
class="scoreGrid">

</div>

</div>



<!-- SERVICE -->

<div class="card">

<h2>😊 Service</h2>

<div
id="serviceButtons"
class="scoreGrid">

</div>

</div>



<!-- AMBIENCE -->

<div class="card">

<h2>🕯 Ambience</h2>

<div
id="ambianceButtons"
class="scoreGrid">

</div>

</div>



<div class="card" id="submitCard">

<button id="submitButton">

Submit Scores

</button>

</div>

class="card hidden"
id="thankYouCard"
>

<h2>

🎉 Score Submitted

</h2>

<button
onclick="window.location.href='index.html'">

Return Home

</button>

</div>

<div class="card">

<button
onclick="window.location.href='index.html'">

← Back Home

</button>

</div>

</main>



<script src="api.js"></script>

<script>

let selectedPerson = null;

let foodScore = null;

let serviceScore = null;

let ambianceScore = null;

let currentRestaurant = "";

function updateProgress(){

    let progress = 0;

    if(selectedPerson) progress++;

    if(foodScore!==null) progress++;

    if(serviceScore!==null) progress++;

    if(ambianceScore!==null) progress++;

    document
    .getElementById("progressText")
    .innerHTML =
        progress + " of 4 completed";

}

window.onload = async function(){

    await loadRestaurant();

    createScoreButtons();

    createPersonButtons();

};



async function loadRestaurant(){

    try{

        const settings =
            await API.getSettings();

        currentRestaurant =
            settings.currentRestaurant;

        document.getElementById(
            "restaurantName"
        ).textContent =
            settings.currentRestaurant;

        document.getElementById(
            "restaurantTime"
        ).textContent =
            settings.currentRestaurantTime;

    }

    catch(error){

        alert(error.message);

    }

}



function createPersonButtons(){

    const buttons =
        document.querySelectorAll(
            ".personButton"
        );

    buttons.forEach(button=>{

        button.onclick=function(){

            buttons.forEach(b=>
                b.classList.remove("selected"));

            this.classList.add("selected");

            selectedPerson =
                this.dataset.person;

            updateProgress();

        };

    });

}



function createScoreButtons(){

    createGrid(
        "foodButtons",
        value=>foodScore=value
    );

    createGrid(
        "serviceButtons",
        value=>serviceScore=value
    );

    createGrid(
        "ambianceButtons",
        value=>ambianceScore=value
    );

}



function createGrid(id,callback){

    const container =
        document.getElementById(id);

    for(let i=1;i<=10;i++){

        const button =
            document.createElement("button");

        button.innerText=i;

        button.className="scoreButton";

        button.onclick=function(){

            container
            .querySelectorAll("button")
            .forEach(b=>
                b.classList.remove("selected"));

            this.classList.add("selected");

            callback(i);

            updateProgress();

        };

        container.appendChild(button);

    }

}



document
.getElementById("submitButton")
.onclick = async function(){

    if(

        !selectedPerson ||

        foodScore===null ||

        serviceScore===null ||

        ambianceScore===null

    ){

        alert(
            "Please complete every section."
        );

        return;

    }

    const button =
        document.getElementById(
            "submitButton"
        );

    button.disabled = true;

    button.innerHTML = "Submitting...";

    try{

        await API.submitScore({

            person:selectedPerson,

            restaurant:currentRestaurant,

            food:foodScore,

            service:serviceScore,

            ambiance:ambianceScore

        });

        document
        .getElementById("submitCard")
        .classList.add("hidden");

        document
        .getElementById("thankYouCard")
        .classList.remove("hidden");

        document
        .getElementById("thankYouText")
        .innerHTML =

            "Thank you <strong>"

            + selectedPerson +

            "</strong> for submitting your scores.";

    }

    catch(error){

        button.disabled = false;

        button.innerHTML =

            "Submit Scores";

        document
        .getElementById("submitMessage")
        .innerHTML =
            error.message;

    }

};
